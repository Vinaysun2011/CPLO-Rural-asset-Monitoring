<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Report</title>
<style>
  :root { --blue:#1f4e78; --bg:#f4f6f9; --line:#d9dee5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:#222; }
  header { background:var(--blue); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  main { padding:20px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab { background:#fff; color:var(--blue); border:1px solid var(--blue); padding:8px 18px; border-radius:6px; font-size:14px; cursor:pointer; }
  .tab.on { background:var(--blue); color:#fff; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .filter-control { display:flex; flex-direction:column; gap:4px; }
  .filter-control label { color:#444; font-size:13px; font-weight:600; }
  select { padding:8px 10px; border:1px solid #bbb; border-radius:6px; font-size:14px; background:#fff; max-width:220px; }
  select[multiple] { width:220px; }
  button { background:var(--blue); color:#fff; border:0; padding:9px 16px; border-radius:6px; font-size:14px; cursor:pointer; }
  button.secondary { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  button:disabled { opacity:.5; cursor:default; }
  .muted { color:#666; font-size:13px; }
  .note { background:#fff8e1; border:1px solid #f0d98a; padding:8px 12px; border-radius:6px; font-size:13px; margin-bottom:12px; }
  .wrap { overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; max-height:68vh; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; text-align:right; }
  th { position:sticky; top:0; background:var(--blue); color:#fff; white-space:normal; text-align:center; min-width:110px; z-index:1; }
  td.l, th.l { text-align:left; }
  tr.total td { font-weight:700; background:#ddebf7; position:sticky; bottom:0; }
  tr.ptotal td { font-weight:600; background:#eef4fa; }
  .pager { display:flex; gap:10px; align-items:center; margin-top:12px; font-size:14px; }
  tbody tr:hover td { background:#f1f7fd; }
  .card { max-width:340px; margin:80px auto; background:#fff; padding:28px; border-radius:10px; border:1px solid var(--line); }
  .card h2 { margin-top:0; }
  input { width:100%; padding:10px; margin:6px 0 14px; border:1px solid #bbb; border-radius:6px; font-size:14px; }
  .err { color:#b00020; font-size:14px; margin-bottom:10px; }
  .hidden { display:none; }
</style>
</head>
<body>

<div id="loginView" class="hidden">
  <div class="card">
    <h2>Sign in</h2>
    <div id="loginErr" class="err"></div>
    <label>Username<input id="u" autocomplete="username"></label>
    <label>Password<input id="p" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" style="width:100%">Sign in</button>
  </div>
</div>

<div id="appView" class="hidden">
  <header>
    <h1>Asset Report</h1>
    <button class="secondary" id="logoutBtn">Sign out</button>
  </header>
  <main>
    <div class="tabs" id="tabs">
      <button class="tab on" data-level="district">District wise</button>
      <button class="tab" data-level="block">Block wise</button>
      <button class="tab" data-level="panchayat">Panchayat wise</button>
    </div>
    <div class="bar">
      <div class="filter-control">
        <label for="fDistrict">Districts</label>
        <select id="fDistrict" multiple size="6" title="Select one or more districts"></select>
      </div>
      <div class="filter-control">
        <label for="fBlock">Blocks</label>
        <select id="fBlock" multiple size="6" title="Select one or more blocks"></select>
      </div>
      <label class="muted" for="pageSize">Rows/page</label>
      <select id="pageSize">
        <option value="5" selected>5</option>
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      <button id="refreshBtn">Generate / Refresh</button>
      <button id="totalBtn" class="secondary" disabled>Show total</button>
      <button id="xlsBtn" class="secondary" disabled>Download Excel (this tab)</button>
      <button id="xlsAllBtn" class="secondary" disabled>Download Excel (all 3 levels)</button>
      <span class="muted" id="status"></span>
    </div>
    <div id="note" class="note hidden"></div>
    <div id="error" class="err"></div>
    <div class="wrap"><table id="tbl"></table></div>
    <div class="pager" id="pager">
      <button class="secondary" id="prevBtn" disabled>&larr; Previous</button>
      <span id="pageInfo" class="muted"></span>
      <button class="secondary" id="nextBtn" disabled>Next &rarr;</button>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => typeof v === 'number' ? v.toLocaleString('en-IN') : esc(v);
let level = 'district', filters = null, busy = false, page = 1, pages = 1, totalToken = 0;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/login') { show(false); throw new Error('Please sign in'); }
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
function show(loggedIn) {
  $('loginView').classList.toggle('hidden', loggedIn);
  $('appView').classList.toggle('hidden', !loggedIn);
}
function getSelectedValues(selectEl) {
  if (!selectEl) return [];
  return Array.from(selectEl.selectedOptions).map(opt => opt.value).filter(Boolean);
}
function qs(extra = {}) {
  const p = new URLSearchParams({level, page_size: $('pageSize').value || '25', ...extra});
  for (const v of getSelectedValues($('fDistrict'))) p.append('district', v);
  if (level !== 'district') {
    for (const v of getSelectedValues($('fBlock'))) p.append('block', v);
  }
  return p.toString();
}
function fillFilters(f) {
  filters = f;
  const d = $('fDistrict');
  const keep = getSelectedValues(d);
  d.innerHTML = f.districts.map(x => `<option>${esc(x)}</option>`).join('');
  for (const x of keep) {
    const opt = Array.from(d.options).find(o => o.value === x);
    if (opt) opt.selected = true;
  }
  fillBlocks();
}
function fillBlocks() {
  const b = $('fBlock');
  const keep = getSelectedValues(b);
  const districtValues = getSelectedValues($('fDistrict'));
  const list = districtValues.length ? districtValues.flatMap(d => filters.blocks[d] || []) : [];
  const unique = [...new Set(list)];
  b.innerHTML = unique.map(x => `<option>${esc(x)}</option>`).join('');
  for (const x of keep) {
    const opt = Array.from(b.options).find(o => o.value === x);
    if (opt) opt.selected = true;
  }
  b.disabled = !districtValues.length || level === 'district';
}
function render(d) {
  const n = d.n_label;
  const th = d.columns.map((c, i) => `<th class="${i < n ? 'l' : ''}">${esc(c)}</th>`).join('');
  const idCol = d.columns.indexOf('PanchayatId');
  const row = (r, cls) => `<tr class="${cls || ''}">` + r.map((v, i) =>
      `<td class="${i < n ? 'l' : ''}">${i === idCol ? esc(v) : fmt(v)}</td>`).join('') + '</tr>';
  const empty = `<tr class="total" id="grandRow"><td class="l" colspan="${d.columns.length}">Grand total is loaded on demand.</td></tr>`;
  $('tbl').innerHTML = `<thead><tr>${th}</tr></thead><tbody>${d.rows.map(r => row(r)).join('')}${row(d.page_total, 'ptotal')}${empty}</tbody>`;
  page = d.page; pages = d.pages;
  const from = d.row_count ? (d.page - 1) * d.page_size + 1 : 0; 
  const to = from ? Math.min(from + d.rows.length - 1, d.row_count) : 0;
  $('pageInfo').textContent = `Page ${d.page} of ${d.pages} (rows ${from}-${to} of ${d.row_count.toLocaleString('en-IN')})`;
  $('prevBtn').disabled = d.page <= 1; $('nextBtn').disabled = d.page >= d.pages;
  $('status').textContent = `data as of ${d.generated_at}`;
  $('xlsBtn').disabled = $('xlsAllBtn').disabled = $('totalBtn').disabled = false;
}
async function loadTotal(d, row) {
  const token = ++totalToken;
  $('totalBtn').disabled = true;
  try {
    const t = await api('/api/report/total?' + qs());
    if (token !== totalToken) return;
    const g = $('grandRow'); if (!g) return;
    const rowHtml = row(['Grand total (all ' + t.row_count.toLocaleString('en-IN') + ')', ...t.total.slice(1)], 'total');
    g.outerHTML = rowHtml;
  } catch (e) {
    if (token !== totalToken) return;
    const g = $('grandRow');
    if (g) g.innerHTML = `<td class="l" colspan="${d.columns.length}">Grand total unavailable (${esc(e.message)}). The current page is still correct.</td>`;
  } finally {
    $('totalBtn').disabled = false;
  }
}
async function load(fresh) {
  if (busy) return;
  busy = true; $('error').textContent = '';
  try {
    if (!filters) fillFilters(await api('/api/filters'));
    const selectedDistricts = getSelectedValues($('fDistrict'));
    const selectedBlocks = getSelectedValues($('fBlock'));
    if (!selectedDistricts.length && !selectedBlocks.length) {
      $('tbl').innerHTML = '<thead></thead><tbody><tr><td class="l">Select at least one district or block to load data.</td></tr></tbody>';
      $('status').textContent = 'No filter selected';
      $('pageInfo').textContent = 'Waiting for filter selection';
      return;
    }
    $('refreshBtn').disabled = $('prevBtn').disabled = $('nextBtn').disabled = true;
    $('status').textContent = 'Loading from database...';
    render(await api('/api/report?' + qs({page, ...(fresh ? {fresh: 1} : {})})));
  } catch (e) { $('error').textContent = e.message; $('status').textContent = ''; }
  finally {
    busy = false; $('refreshBtn').disabled = false;
    $('prevBtn').disabled = page <= 1; $('nextBtn').disabled = page >= pages;
  }
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  t.classList.add('on'); level = t.dataset.level; page = 1; fillBlocks();
  if (!getSelectedValues($('fDistrict')).length && !getSelectedValues($('fBlock')).length) {
    $('tbl').innerHTML = '<thead></thead><tbody><tr><td class="l">Select at least one district or block to load data.</td></tr></tbody>';
    $('pageInfo').textContent = 'Waiting for filter selection';
    $('status').textContent = 'No filter selected';
    return;
  }
  load(false);
});
$('fDistrict').onchange = () => { page = 1; fillBlocks(); if (getSelectedValues($('fDistrict')).length || getSelectedValues($('fBlock')).length) load(false); else { $('tbl').innerHTML = '<thead></thead><tbody><tr><td class="l">Select at least one district or block to load data.</td></tr></tbody>'; $('status').textContent = 'No filter selected'; $('pageInfo').textContent = 'Waiting for filter selection'; } };
$('fBlock').onchange = () => { page = 1; if (getSelectedValues($('fDistrict')).length || getSelectedValues($('fBlock')).length) load(false); else { $('tbl').innerHTML = '<thead></thead><tbody><tr><td class="l">Select at least one district or block to load data.</td></tr></tbody>'; $('status').textContent = 'No filter selected'; $('pageInfo').textContent = 'Waiting for filter selection'; } };
$('pageSize').onchange = () => { page = 1; if (getSelectedValues($('fDistrict')).length || getSelectedValues($('fBlock')).length) load(false); };
$('prevBtn').onclick = () => { if (page > 1) { page--; load(false); } };
$('nextBtn').onclick = () => { if (page < pages) { page++; load(false); } };
$('refreshBtn').onclick = async () => { filters = null; page = 1; await load(true); };
$('totalBtn').onclick = () => {
  const row = (r, cls) => `<tr class="${cls || ''}">` + r.map((v, i) => `<td class="${i < 0 ? 'l' : ''}">${fmt(v)}</td>`).join('') + '</tr>';
  const current = $('tbl').querySelector('thead tr');
  const cols = current ? current.children.length : 1;
  const d = { columns: Array.from({ length: cols }, (_, i) => `Col${i + 1}`) };
  loadTotal(d, row);
};
$('xlsBtn').onclick = () => { location.href = '/api/report.xlsx?' + qs(); };
$('xlsAllBtn').onclick = () => { location.href = '/api/report.xlsx?' + qs({level: 'all'}); };
$('logoutBtn').onclick = async () => { await api('/api/logout', {method:'POST'}); show(false); };
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try {
    await api('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:$('u').value, password:$('p').value})});
    show(true); load(false);
  } catch (e) { $('loginErr').textContent = e.message; }
};
$('p').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
(async () => {
  const me = await fetch('/api/me').then(r => r.json());
  if (me.user) { show(true); load(false); } else show(false);
})();
</script>
</body>
</html>
